[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "krisis"
version = "0.2.3"
description = "A clinical evaluation framework for large language models."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Emmanuel Watila", email = "hi@devsgnr.xyz" }
]
keywords = [
    "llm",
    "llm-evaluation",
    "evaluation",
    "benchmark",
    "clinical-ai",
    "safety",
    "calibration",
    "abstention",
    "chronic-kidney-disease",
    "healthcare",
    "machine-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
requires-python = ">=3.10"

dependencies = [
    # Data & ML
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.4.0",
    "category-encoders>=2.6.0",
    "scipy>=1.12.0",
    "pydantic>=2.8.0",
]

[project.optional-dependencies]

# pip install krisis[api]
api = [
    "openai>=1.30.0",
]

# pip install krisis[hf]
hf = [
    "transformers>=4.40.0",
    "huggingface-hub>=0.23.0",
    "torch>=2.2.0",
    "accelerate>=0.33.0",
    "sentencepiece>=0.2.0",
]

# pip install krisis[all]
# Installs every optional backend integration.
all = [
    "openai>=1.30.0",
    "transformers>=4.40.0",
    "huggingface-hub>=0.23.0",
    "torch>=2.2.0",
    "accelerate>=0.33.0",
    "sentencepiece>=0.2.0",
]

# pip install krisis[dev]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pandas-stubs>=2.0.0",
    "mkdocs>=1.6.0",
    "mkdocs-material[imaging]>=9.0.0,<10.0.0",
    "mkdocstrings[python]>=0.30.0,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/devsgnr/krisis"
Repository = "https://github.com/devsgnr/krisis"
Issues = "https://github.com/devsgnr/krisis/issues"
Documentation = "https://devsgnr.github.io/krisis/"

[tool.hatch.build.targets.wheel]
packages = ["krisis"]

[tool.hatch.build]
exclude = [
    "/.github",
    "/build",
    "/datasets",
    "/dist",
    "/docs",
    "/examples",
    "/results",
    "/site",
    "/tests",
    "**/.DS_Store",
    "**/__pycache__",
    "**/*.pyc",
]

[tool.hatch.build.targets.sdist]
include = [
    "krisis",
    "LICENSE",
    "README.md",
    "pyproject.toml",
]

# ── Ruff (linting + formatting) ───────────────────────────────────────────────
[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long — ruff format handles this
]

[tool.ruff.lint.isort]
known-first-party = ["krisis"]

# ── Mypy (type checking) ──────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
pretty = true

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=krisis --cov-report=term-missing"
